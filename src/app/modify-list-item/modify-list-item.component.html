<form [formGroup]="flagForm" (ngSubmit)="onSubmit()" class="form-container">
  <!-- ID Field -->
  <mat-form-field appearance="outline" class="form-field">
    <mat-label matTooltip="Auto-Generated ID">ID</mat-label>
    <input matInput type="number" id="id" formControlName="id"/>
  </mat-form-field>

  <!-- Name Field -->
  <mat-form-field appearance="outline" class="form-field">
    <mat-label matTooltip="Enter Country">Country</mat-label>
    <input matInput type="text" id="country" formControlName="country"/>
  </mat-form-field>

  <!-- Material Field -->
  <mat-form-field appearance="outline" class="form-field">
    <mat-label matTooltip="Enter Material">Material</mat-label>
    <input matInput type="text" id="material" formControlName="material" />
  </mat-form-field>

  <!-- Size Field -->
  <mat-form-field appearance="outline" class="form-field">
    <mat-label matTooltip="Enter Size">Size</mat-label>
    <input matInput type="text" id="size" formControlName="size" />
  </mat-form-field>

  <!-- Is In Stock Checkbox -->
  <div class="form-group">
    <mat-checkbox id="isInStock" formControlName="isInStock">
      Is In Stock
    </mat-checkbox>
  </div>

  <!-- Image Path Field -->
  <mat-form-field appearance="outline" class="form-field">
    <mat-label matTooltip="Enter Image Link">Image</mat-label>
    <input matInput type="text" id="image" formControlName="image" 
           [appHighlightOnFocus]="'lightblue'" />
  </mat-form-field>

  <!-- Submit and Back Buttons -->
  <div class="button-group">
    <button mat-raised-button color="primary" matTooltip="Submit Button" type="submit">Submit</button>
    <button mat-raised-button color="tertiary" type="button" matTooltip="Back To List Module" 
            (click)="navigateToFlagList()">Back to List</button>
  </div>
</form>

<div *ngIf="error" class="error">{{ error }}</div>
